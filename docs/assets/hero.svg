<svg width="100%" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>runvault — plain-file experiment tracking for reproducible research</title>
<desc>One run is one directory; its identity is fixed by three stacked hashes — env_hash, then config_hash, then execution_hash.</desc>
<style>
  .ts    { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 13px; fill: #444441; }
  .tl    { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; fill: #534AB7; letter-spacing: 2px; }
  .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 30px; font-weight: 600; fill: #2C2C2A; }
  .glab  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 11px; font-weight: 500; fill: #888780; letter-spacing: 0.5px; }
  .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; fill: #2C2C2A; }
  .mons  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #5F5E5A; }
  .gray-fill   { fill: #F1EFE8; stroke: #C7C5BD; stroke-width: 0.6; }
  .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.6; }
  .teal-fill   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.6; }
  .arrd { stroke: #534AB7; stroke-width: 1.6; fill: none; }
  .rule { stroke: #C7C5BD; stroke-width: 0.8; fill: none; }
  @media (prefers-color-scheme: dark) {
    .ts    { fill: #C7C5BD; }
    .tl    { fill: #AFA9EC; }
    .title { fill: #E5E5E2; }
    .glab  { fill: #8C8B85; }
    .mono  { fill: #E5E5E2; }
    .mons  { fill: #C7C5BD; }
    .gray-fill   { fill: #3A3A37; stroke: #5F5E5A; }
    .purple-fill { fill: #534AB7; stroke: #AFA9EC; }
    .teal-fill   { fill: #0F6E56; stroke: #5DCAA5; }
    .arrd { stroke: #AFA9EC; }
    .rule { stroke: #5F5E5A; }
  }
</style>
<defs>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- title block (left) -->
<text class="tl"    x="44" y="96">EXPERIMENT RECORDS · REPRODUCIBILITY</text>
<text class="title" x="42" y="140">runvault</text>
<text class="ts"    x="44" y="176">Plain-file experiment tracking for reproducible research.</text>
<text class="ts"    x="44" y="198">One run is one directory, and the directory is the record.</text>
<text class="ts"    x="44" y="220">Its identity is three hashes, not a naming convention.</text>

<!-- MOTIF (right): a run directory, and the three stacked hashes that fix it -->
<!-- the run directory -->
<rect class="gray-fill" x="470" y="86" width="118" height="112" rx="8"/>
<path d="M470 108 H588" class="rule"/>
<text class="mono" x="482" y="103">run/</text>
<text class="mons" x="484" y="126">config.json</text>
<text class="mons" x="484" y="144">metrics.csv</text>
<text class="mons" x="484" y="162">events.jsonl</text>
<text class="mons" x="484" y="180">artifacts/</text>
<text class="glab" x="470" y="218">one directory</text>

<path d="M596 142 H638" class="arrd" marker-end="url(#arrowAccent)"/>

<!-- the three stacked hashes -->
<rect class="teal-fill"   x="646" y="80"  width="214" height="36" rx="6"/>
<text class="mono" x="660" y="103">env_hash</text>
<text class="mons" x="768" y="103">os · toolchain · locks</text>

<rect class="purple-fill" x="646" y="124" width="214" height="36" rx="6"/>
<text class="mono" x="660" y="147">config_hash</text>
<text class="mons" x="768" y="147">condition · data</text>

<rect class="purple-fill" x="646" y="168" width="214" height="36" rx="6"/>
<text class="mono" x="660" y="191">execution_hash</text>
<text class="mons" x="790" y="191">seeds · commit</text>

<path d="M636 98 V196" class="arrd" marker-end="url(#arrowAccent)"/>
<text class="glab" x="646" y="224">the same condition, and the same execution of it</text>
</svg>
