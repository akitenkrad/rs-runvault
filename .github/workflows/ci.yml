name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The schemas are the specification: these two pin what they must accept
      # and reject, and check every example in the design note against them.
      - run: uv run --with jsonschema --with rfc3339-validator python tools/test_schemas.py
      # The design note lives in the author's Obsidian vault, so on a runner this
      # checks the schemas and says so rather than pretending the examples passed.
      - run: uv run --with jsonschema --with rfc3339-validator python tools/check_design_doc.py --if-present
      # The vectors exist so two implementations agree. Regenerating them from
      # the Python side must not change a byte, or someone edited them to make a
      # test pass instead of fixing the implementation.
      - run: uv run --with blake3 python tools/gen_testvectors.py
      - run: git diff --exit-code schema/v1/testvectors/

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The Pydantic models are a view of schema/v1. Committing them and
      # regenerating here is what keeps the view from drifting away from the
      # specification: "it can be generated" is not the same as "it matches".
      - run: uv run --with datamodel-code-generator python tools/gen_pydantic.py
      - run: git diff --exit-code python/src/runvault/models/
      - run: uv run --group dev pytest -q
        working-directory: python
