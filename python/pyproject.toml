[project]
name = "runvault"
version = "0.1.0"
description = "Python second implementation of runvault: the hash identity and the run writer"
requires-python = ">=3.11"
dependencies = [
    "blake3>=0.4",
    "pydantic>=2",
]

[project.optional-dependencies]
# The read side (`runvault.read`) only. A repository that records runs but never
# analyses them must not be made to install pandas and its wheels, so the writer
# keeps no dependency on it.
read = [
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # The read-side tests need what the `read` extra installs.
    "pandas>=2.2",
    # The schemas, not the Pydantic models, are what the conditional requirements
    # live in; the tests hold every emitted file to them.
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runvault"]
